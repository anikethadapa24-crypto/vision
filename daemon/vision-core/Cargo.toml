[package]
name = "vision-core"
version.workspace = true
edition.workspace = true

[dependencies]
pdf-extract = "0.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt", "sync"] }
tokio-stream = "0.1.19"
tonic = "0.14.6"
vision-proto = { path = "../vision-proto" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
