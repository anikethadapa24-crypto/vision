[package]
name = "vision-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
async-stream = "0.3.6"
http = "1.5.0"
hyper-util = "0.1.20"
notify = "8.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-stream = "0.1.19"
tonic = "0.14.6"
tower = "0.5.3"
vision-core = { path = "../vision-core" }
vision-proto = { version = "0.1.0", path = "../vision-proto" }

[dev-dependencies]
tempfile = "3.27.0"
